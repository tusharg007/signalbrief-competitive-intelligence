services:
  - type: web
    name: signalbrief
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerCommand: .venv/bin/python -m signalbrief.hosted
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ZAPIER_HOOK_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WEBHOOK_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SECURE_COOKIES
        value: "true"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: WORKER_POLL_SECONDS
        value: "10"
      - key: MAX_DAILY_RUNS
        value: "5"
      - key: SHOWCASE_RUN_IDS
        value: ""
