[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "signalbrief"
version = "1.0.0"
description = "Evidence-backed competitive strategy with CrewAI, AutoGen, and Zapier"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.11,<3",
  "pydantic-settings>=2.8,<3", "python-dotenv>=1,<2", "httpx>=0.28,<1", "itsdangerous>=2.2,<3",
  "beautifulsoup4>=4.13,<5", "crewai==1.6.1",
  "autogen-agentchat>=0.7,<0.8", "autogen-ext[openai]>=0.7,<0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
signalbrief-worker = "signalbrief.worker:main"
signalbrief-setup = "signalbrief.setup:main"
signalbrief-evaluate = "signalbrief.evaluation:main"

[tool.setuptools.packages.find]
include = ["signalbrief*"]

[tool.setuptools.package-data]
signalbrief = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
